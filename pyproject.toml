[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docreaper"
version = "2.0.0"
description = "Academic book discovery, mathematical deduplication and cloud storage"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "lxml>=5.1",
    "PyMuPDF>=1.24.3",
    "python-docx>=1.1",
    "pydantic-settings>=2.2",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.3"]
gcs = ["google-cloud-storage>=2.14"]

[project.scripts]
docreaper = "docreaper.cli:app"

[tool.setuptools]
packages = ["docreaper"]
package-dir = {"docreaper" = "."}

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
python_files = ["test_*.py"]

[tool.ruff]
extend-exclude = [".venv"]

[tool.ruff.lint]
per-file-ignores = {"__init__.py" = ["N999"]}

[tool.ruff.lint.isort]
known-first-party = ["docreaper"]

[tool.coverage.run]
source = ["docreaper"]
omit = ["test_*.py"]
